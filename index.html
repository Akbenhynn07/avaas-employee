  <script>
    // --- CONFETTI CELEBRATION ENGINE ---
    function launchCelebration() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#2563eb', '#0284c7', '#059669', '#d97706', '#7c3aed', '#db2777'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height * 0.45,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.9) * 12,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
          alpha: 1,
        });
      }

      let animationFrame;
      function renderParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25; // gravity
          p.rotation += p.rotationSpeed;
          p.alpha -= 0.012;

          if (p.alpha > 0) {
            active = true;
            ctx.save();
            ctx.globalAlpha = Math.max(p.alpha, 0);
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (active) {
          animationFrame = requestAnimationFrame(renderParticles);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(animationFrame);
        }
      }
      renderParticles();
    }

    // --- REAL AUTHORIZED EMPLOYEES & ASSIGNED CREDENTIALS ---

    let registeredUsers = DEFAULT_ACCOUNTS;

    // Load registered users from backend API
    async function fetchUsersFromDb() {
      try {
        const res = await fetch('/api/users');
        if (res.ok) {
          const data = await res.json();
          if (data.users && data.users.length > 0) {
            registeredUsers = data.users;
            render();
          }
        }
      } catch (e) {
        // Fallback to local default accounts
      }
    }

    function getFormattedToday() {
      return new Intl.DateTimeFormat('en-US', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }).format(new Date());
    }

    function getTodayISO() {
      return new Date().toISOString().split('T')[0];
    }

    function formatDateFromISO(iso) {
      if (!iso) return getFormattedToday();
      const parts = iso.split('-');
      if (parts.length !== 3) return iso;
      const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      return new Intl.DateTimeFormat('en-US', {
        weekday: 'short',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }).format(d);
    }

    // App State - All dummy entries removed! Starts completely clean.
    let state = {
      currentUser: null,
      activeTab: 'standup', // 'standup' | 'analysis' | 'board'
      selectedDate: getTodayISO(),
      meetingDuration: '45 mins',
      customDuration: '',
      workDone: '',
      planTomorrow: '',
      attendanceAlert: null,
      loginError: null,
      loginEmail: '',
      loginPassword: '',
      showCredentialsModal: false,
      isSaving: false,

      // Calendar state for Analysis Page
      calendarMonth: new Date().getMonth(),
      calendarYear: new Date().getFullYear(),
      analysisSelectedDate: getTodayISO(),
      analysisEmployeeFilter: 'all',
      copiedDigest: false,
    };

    // Attendance entries loaded directly from SQLite database
    let entries = [];

    async function loadAttendanceFromDb() {
      try {
        const res = await fetch('/api/attendance');
        if (res.ok) {
          const data = await res.json();
          entries = data.entries || [];
          if (state.currentUser) {
            syncUserTodayForm(state.currentUser);
          }
          render();
        }
      } catch (e) {
        console.warn('Backend API unavailable, using offline cache');
      }
    }

    // Restore saved session if any
    try {
      const savedUser = localStorage.getItem('avaas_active_session_v4');
      if (savedUser) {
        state.currentUser = JSON.parse(savedUser);
      }
    } catch (e) {}

    function syncUserTodayForm(user) {
      if (!user) return;
      const todayEntry = entries.find(
        e => e.userEmail.toLowerCase() === user.email.toLowerCase() && e.date === state.selectedDate
      );
      if (todayEntry) {
        state.workDone = todayEntry.workDone;
        state.planTomorrow = todayEntry.planTomorrow;
        state.meetingDuration = todayEntry.meetingDuration;
        state.attendanceAlert = `Attendance marked for ${todayEntry.formattedDate} date`;
      } else {
        state.workDone = '';
        state.planTomorrow = '';
        state.attendanceAlert = null;
      }
    }

    // --- ACTIONS ---
    window.handleLoginSubmit = async function(e) {
      e.preventDefault();
      state.loginError = null;

      const emailVal = state.loginEmail.trim().toLowerCase();
      const passVal = state.loginPassword.trim();

      if (!emailVal) {
        state.loginError = 'Please enter your company email address.';
        render();
        return;
      }

      if (!emailVal.endsWith('@avaas.me')) {
        state.loginError = 'Access restricted: Only official @avaas.me company accounts are authorized.';
        render();
        return;
      }

      if (!passVal) {
        state.loginError = 'Please enter your account password.';
        render();
        return;
      }

      // Authenticate against Backend SQLite Database
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailVal, password: passVal }),
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          state.loginError = data.error || 'Invalid credentials. Access denied.';
          render();
          return;
        }

        // Login Succeeded
        state.currentUser = data.user;
        localStorage.setItem('avaas_active_session_v4', JSON.stringify(data.user));
        state.loginPassword = '';
        state.loginError = null;

        await loadAttendanceFromDb();
        syncUserTodayForm(data.user);
        render();

      } catch (err) {
        // Fallback to local evaluation if server API is cold
        const found = registeredUsers.find(u => u.email.toLowerCase() === emailVal);
        if (!found || found.password !== passVal) {
          state.loginError = 'Incorrect password. One employee cannot open another employee\'s profile without their password.';
          render();
          return;
        }
        state.currentUser = found;
        localStorage.setItem('avaas_active_session_v4', JSON.stringify(found));
        syncUserTodayForm(found);
        render();
      }
    };

    window.handleLogout = function() {
      state.currentUser = null;
      state.loginPassword = '';
      state.loginError = null;
      localStorage.removeItem('avaas_active_session_v4');
      render();
    };

    window.setTab = function(tab) {
      state.activeTab = tab;
      render();
    };

    window.setDurationPreset = function(preset) {
      state.meetingDuration = preset;
      render();
    };

    window.handleDateChange = function(newDate) {
      state.selectedDate = newDate;
      syncUserTodayForm(state.currentUser);
      render();
    };

    window.handleFormSubmit = async function(e) {
      e.preventDefault();

      const workEl = document.getElementById('field-work');
      const tomorrowEl = document.getElementById('field-tomorrow');
      const customDurEl = document.getElementById('field-custom-duration');

      const workVal = workEl ? workEl.value.trim() : state.workDone.trim();
      const tomorrowVal = tomorrowEl ? tomorrowEl.value.trim() : state.planTomorrow.trim();
      let durationVal = state.meetingDuration;

      if (durationVal === 'Custom' && customDurEl) {
        durationVal = customDurEl.value.trim() || 'Custom';
      }

      if (!workVal) {
        alert('Please fill in what work you did today.');
        return;
      }

      if (!tomorrowVal) {
        alert('Please fill in what you are doing tomorrow.');
        return;
      }

      const formatted = formatDateFromISO(state.selectedDate);
      const confirmationText = `Attendance marked for ${formatted} date`;

      const newEntry = {
        id: `${state.currentUser.email}_${state.selectedDate}`,
        userEmail: state.currentUser.email,
        userName: state.currentUser.name || state.currentUser.role,
        roleTitle: state.currentUser.title,
        date: state.selectedDate,
        formattedDate: formatted,
        meetingDuration: durationVal,
        workDone: workVal,
        planTomorrow: tomorrowVal,
        timestamp: Date.now(),
      };

      state.isSaving = true;
      render();

      // Save directly to Backend SQLite Database
      try {
        const res = await fetch('/api/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newEntry),
        });

        if (res.ok) {
          // Re-fetch all entries from database to guarantee synchronization
          await loadAttendanceFromDb();
        } else {
          entries = [newEntry, ...entries.filter(it => it.id !== newEntry.id)];
        }
      } catch (err) {
        entries = [newEntry, ...entries.filter(it => it.id !== newEntry.id)];
      }

      state.isSaving = false;
      state.workDone = workVal;
      state.planTomorrow = tomorrowVal;
      state.attendanceAlert = confirmationText;

      launchCelebration();
      render();
    };

    // Calendar Navigation for CEO Analysis
    window.prevCalendarMonth = function() {
      if (state.calendarMonth === 0) {
        state.calendarMonth = 11;
        state.calendarYear -= 1;
      } else {
        state.calendarMonth -= 1;
      }
      render();
    };

    window.nextCalendarMonth = function() {
      if (state.calendarMonth === 11) {
        state.calendarMonth = 0;
        state.calendarYear += 1;
      } else {
        state.calendarMonth += 1;
      }
      render();
    };

    window.selectAnalysisDate = function(isoDateStr) {
      state.analysisSelectedDate = isoDateStr;
      render();
    };

    window.copyAnalysisReport = function() {
      const selected = state.analysisSelectedDate;
      const formatted = formatDateFromISO(selected);
      const dayEntries = entries.filter(e => e.date === selected);

      const lines = [
        `======================================================`,
        `  AVAAS EXECUTIVE DAILY ATTENDANCE & STANDUP REPORT   `,
        `======================================================`,
        `Date: ${formatted}`,
        `Attendance Rate: ${dayEntries.length}/${registeredUsers.length} Executives Marked Present`,
        `Database: SQLite (avaas.db)`,
        `Reviewed by: Akshay (CEO, ceo@avaas.me)`,
        `------------------------------------------------------\n`,
        ...registeredUsers.map(u => {
          const entry = dayEntries.find(e => e.userEmail.toLowerCase() === u.email.toLowerCase());
          if (!entry) {
            return `[ ] ${u.role} - ${u.name} (${u.email}) - STATUS: ABSENT / PENDING\n`;
          }
          return `[✓] ${u.role} - ${u.name} (${u.email}) - STATUS: PRESENT
  • Duration in Meeting Call: ${entry.meetingDuration}
  • Work Done: ${entry.workDone}
  • Next Day Plan: ${entry.planTomorrow}\n`;
        })
      ];

      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        state.copiedDigest = true;
        render();
        setTimeout(() => {
          state.copiedDigest = false;
          render();
        }, 2200);
      });
    };

    // --- RENDER ENGINE ---
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!state.currentUser) {
        app.innerHTML = renderLoginView();
      } else {
        app.innerHTML = `
          ${renderNavbar()}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-32">
            ${state.activeTab === 'analysis' && state.currentUser.isCeo 
                ? renderCeoAnalysisView() 
                : state.activeTab === 'board'
                ? renderBoardView()
                : renderStandupView()}
          </main>
          ${renderFooter()}
        `;
      }
    }

                  </button>

                    <span>Team Board</span>
                  </button>

                  <!-- EXCLUSIVE CEO ANALYSIS PAGE TAB -->
                  ${user.isCeo ? `
                    <button onclick="setTab('analysis')" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                      state.activeTab === 'analysis'
                        ? 'bg-gradient-to-r from-blue-700 to-indigo-700 text-white shadow-md shadow-blue-700/25'
                        : 'text-blue-800 bg-blue-50/80 hover:bg-blue-100 border border-blue-200'

                      <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>

            </div>

            <!-- Mobile Subnav -->

              <button onclick="setTab('standup')" class="flex-1 py-2 rounded-xl text-xs font-bold text-center ${state.activeTab === 'standup' ? 'bg-blue-600 text-white' : 'text-slate-600 bg-white border border-blue-100'}">

      const dateEntries = entries.filter(e => e.date === selectedIso);

      const presentCount = dateEntries.length;
      const totalCount = registeredUsers.length;
      const ratePct = totalCount > 0 ? Math.round((presentCount / totalCount) * 100) : 0;

      let totalMeetingMinutes = 0;
      dateEntries.forEach(e => {
        const dur = (e.meetingDuration || '').toLowerCase();
        if (dur.includes('15')) totalMeetingMinutes += 15;
        else if (dur.includes('30')) totalMeetingMinutes += 30;
        else if (dur.includes('45')) totalMeetingMinutes += 45;
        else if (dur.includes('60') || dur.includes('1 hour') || dur.includes('1h')) totalMeetingMinutes += 60;

      return `

                        <span class="font-bold text-slate-600">Duration of call in meeting:</span>
                        <span class="font-mono font-extrabold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-lg border border-blue-200">
                          ${entry.meetingDuration}
                        </span>
                      </div>

                      <!-- What Work Did You Do? -->
                      <div class="bg-blue-50/50 p-3.5 rounded-2xl border border-blue-100 space-y-1">
                        <div class="flex items-center gap-1.5 text-blue-900 font-extrabold text-xs">
                          <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                          <span>What work did you do?</span>
                        </div>
                        <p class="text-xs text-slate-700 leading-relaxed pl-4 border-l-2 border-indigo-400 whitespace-pre-line">
                          ${entry.workDone}
                        </p>
                      </div>

                      <!-- What Are You Doing Tomorrow? -->
                      <div class="bg-amber-50/40 p-3.5 rounded-2xl border border-amber-100 space-y-1">
                        <div class="flex items-center gap-1.5 text-amber-900 font-extrabold text-xs">
                          <svg class="w-3.5 h-3.5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                          <span>What are you doing tomorrow?</span>
                        </div>
                        <p class="text-xs text-slate-700 leading-relaxed pl-4 border-l-2 border-amber-400 whitespace-pre-line">
                          ${entry.planTomorrow}
                        </p>
                      </div>
                    </div>
                  `;
                }).join('') : `
                  <div class="bg-white rounded-3xl p-8 border border-blue-100 text-center space-y-2">
                    <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-400 flex items-center justify-center mx-auto">
                      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </div>
                    <h4 class="text-sm font-bold text-slate-800">No Submissions on this Date</h4>
                    <p class="text-xs text-slate-500 max-w-sm mx-auto">
                      No employee has submitted attendance or standup responses for ${formattedSelected} yet.
                    </p>
                  </div>
                `}
              </div>

              <!-- Status Roster for this date -->
              <div class="bg-white rounded-3xl p-5 border border-blue-100 shadow-sm space-y-2">
                <span class="text-xs font-extrabold uppercase tracking-wider text-slate-500">
                  Attendance Status Roster (${formattedSelected})
                </span>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-2">
                  ${registeredUsers.map(u => {
                    const hasSubmitted = dateEntries.some(e => e.userEmail.toLowerCase() === u.email.toLowerCase());
                    return `
                      <div class="p-2.5 rounded-xl border flex items-center justify-between gap-2 ${
                        hasSubmitted
                          ? 'bg-emerald-50/60 border-emerald-200 text-emerald-900'
                          : 'bg-slate-50 border-slate-200 text-slate-500'
                      }">
                        <div class="truncate text-xs font-bold">
                          <span>${u.name}</span>
                        </div>
                        <span class="text-[10px] font-mono font-bold ${hasSubmitted ? 'text-emerald-700' : 'text-slate-400'}">
                          ${hasSubmitted ? 'Present' : 'Pending'}
                        </span>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

            </div>

          </div>

        </div>
      `;
    }

    // --- TEAM BOARD VIEW ---
    function renderBoardView() {
      const todayFormatted = formatDateFromISO(state.selectedDate);
      const dayEntries = entries.filter(e => e.date === state.selectedDate);
      const checkedInCount = dayEntries.length;
      const totalCount = registeredUsers.length;
      const pct = totalCount > 0 ? Math.round((checkedInCount / totalCount) * 100) : 0;

      return `
        <div class="space-y-6">

          <!-- Stat Overview Cards -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Progress Card -->
            <div class="bg-white p-5 rounded-3xl border border-blue-100 shadow-sm">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Attendance Rate</span>
                <span class="text-xs font-mono font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-200">${pct}%</span>
              </div>
              <div class="flex items-baseline gap-2">
                <span class="text-3xl font-black text-slate-900">${checkedInCount}</span>
                <span class="text-slate-500 text-sm font-semibold">/ ${totalCount} Executives Marked</span>
              </div>
              <div class="w-full bg-slate-100 h-2 rounded-full mt-3 overflow-hidden">
                <div class="bg-gradient-to-r from-blue-500 to-sky-500 h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
              </div>
            </div>

            <!-- Team Roster Card -->
            <div class="bg-white p-5 rounded-3xl border border-blue-100 shadow-sm">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Leadership Team</span>
                <span class="text-xs font-mono text-blue-600 font-bold">@avaas.me</span>
              </div>
              <div class="flex items-baseline gap-2">
                <span class="text-3xl font-black text-slate-900">${totalCount}</span>
                <span class="text-slate-500 text-sm font-semibold">Executive Accounts</span>
              </div>
              <div class="flex -space-x-2 mt-3 overflow-hidden">
                ${registeredUsers.map(u => `
                  <div title="${u.name} (${u.email})" class="w-8 h-8 rounded-xl ${u.avatarBg} border-2 border-white flex items-center justify-center text-[11px] font-extrabold shadow-sm">
                    ${u.initials}
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Executive Sync Actions -->
            <div class="bg-white p-5 rounded-3xl border border-blue-100 shadow-sm flex flex-col justify-between">
              <div>
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Standup Summary</span>
                <p class="text-xs text-slate-500 mt-1">Copy formatted standup summary for sync meetings.</p>
              </div>
              <div class="flex items-center gap-2 mt-3">
                <button onclick="copyAnalysisReport()" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition shadow-md shadow-blue-500/20">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                  <span>${state.copiedDigest ? 'Copied to Clipboard!' : 'Copy Summary'}</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Board Roster Section -->
          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-blue-100 shadow-sm">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
              <div>
                <h3 class="text-lg font-bold text-slate-900">
                  Executive Daily Check-In Roster
                </h3>
                <p class="text-xs text-slate-500 mt-0.5">Live database submissions from all 6 company accounts for ${todayFormatted}</p>
              </div>
            </div>

            <!-- Executive Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${registeredUsers.map(user => {
                const entry = dayEntries.find(e => e.userEmail.toLowerCase() === user.email.toLowerCase());
                const isLogged = !!entry;
                return `
                  <div class="rounded-3xl p-5 border transition-all ${
                    isLogged
                      ? 'bg-blue-50/40 border-blue-200 shadow-sm'
                      : 'bg-slate-50/70 border-slate-200 border-dashed opacity-80'
                  }">
                    <div class="flex items-start justify-between gap-3 mb-3">
                      <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl ${user.avatarBg} flex items-center justify-center font-extrabold text-sm shadow-sm">
                          ${user.initials}
                        </div>
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="text-sm font-extrabold text-slate-900">${user.name}</span>
                            <span class="text-xs text-slate-500">(${user.role})</span>
                            ${user.isCeo ? '<span class="text-[9px] bg-amber-100 text-amber-800 px-1.5 py-0.2 rounded font-mono font-bold">CEO</span>' : ''}
                          </div>
                          <span class="text-xs font-mono text-blue-600">${user.email}</span>
                        </div>
                      </div>

                      ${isLogged ? `
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs font-bold">
                          <svg class="w-3.5 h-3.5 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                          Present
                        </span>
                      ` : `
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-slate-200 text-slate-600 text-xs font-semibold">
                          Pending
                        </span>
                      `}
                    </div>

                    ${isLogged && entry ? `
                      <div class="mt-4 pt-3 border-t border-blue-100 space-y-2.5">
                        <div class="flex items-center gap-2 text-xs">
                          <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                          <span class="text-slate-600 font-bold">Meeting Call Duration:</span>
                          <span class="text-blue-800 font-mono font-bold bg-blue-100/70 px-2 py-0.5 rounded border border-blue-200">${entry.meetingDuration}</span>
                        </div>

                        <div class="bg-white p-3 rounded-2xl border border-blue-100 text-xs space-y-1">
                          <div class="flex items-center gap-1.5 text-indigo-700 font-bold text-[11px]">
                            <svg class="w-3 h-3 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            <span>Work Completed:</span>
                          </div>
                          <p class="text-slate-700 leading-relaxed pl-3 border-l-2 border-indigo-300 whitespace-pre-line">${entry.workDone}</p>
                        </div>

                        <div class="bg-white p-3 rounded-2xl border border-blue-100 text-xs space-y-1">
                          <div class="flex items-center gap-1.5 text-amber-700 font-bold text-[11px]">
                            <svg class="w-3 h-3 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            <span>Tomorrow's Roadmap:</span>
                          </div>
                          <p class="text-slate-700 leading-relaxed pl-3 border-l-2 border-amber-300 whitespace-pre-line">${entry.planTomorrow}</p>
                        </div>
                      </div>
                    ` : `
                      <div class="mt-4 pt-3 border-t border-slate-200 text-center py-3">
                        <span class="text-xs text-slate-400 italic">No standup submitted for today yet</span>
                      </div>
                    `}
                  </div>
                `;
              }).join('')}
            </div>

          </div>

        </div>
      `;
    }

    // --- LOGIN VIEW (Fullscreen AVAAS Logo Background) ---
    function renderLoginView() {
      return `
        <div class="relative min-h-screen w-full flex items-center justify-center p-4 bg-white" style="background-image: url('/avaas-logo.png'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;">
          <!-- Soft translucent white overlay so the logo spans the entire screen while form remains crystal clear -->
          <div class="absolute inset-0 bg-white/45 backdrop-blur-[1px]"></div>

          <div class="relative w-full max-w-md z-10">

            <!-- Login Box -->
            <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-slate-200/90 shadow-blue-900/10">
              <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-sky-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-blue-500/20">
                    A
                  </div>
                  <div>
                    <h2 class="text-base font-extrabold text-slate-900">Secure Sign In</h2>
                    <p class="text-xs text-slate-500">Authenticate with company email</p>
                  </div>
                </div>
                <div class="text-[11px] font-mono font-bold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-full">
                  AVAAS Portal
                </div>
              </div>

              ${state.loginError ? `
                <div class="mb-5 p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-2.5">
                  <svg class="w-4 h-4 flex-shrink-0 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  <span>${state.loginError}</span>
                </div>
              ` : ''}

              <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Company Email
                  </label>
                  <input
                    type="email"
                    value="${state.loginEmail}"
                    oninput="state.loginEmail = this.value"
                    placeholder="e.g. ceo@avaas.me"
                    class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-300 text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 font-mono shadow-sm"
                  />
                </div>

                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Password
                  </label>
                  <input
                    type="password"
                    value="${state.loginPassword}"
                    oninput="state.loginPassword = this.value"
                    placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-2xl bg-white border border-slate-300 text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 shadow-sm"
                  />
                  <p class="text-[11px] text-slate-400 mt-1">One person cannot open another's profile without their password.</p>
                </div>

                <button
                  type="submit"
                  class="w-full flex items-center justify-center gap-2 py-3.5 px-4 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm transition-all shadow-lg shadow-blue-500/20 active:scale-[0.99] mt-2"
                >
                  <span>Sign In to Dashboard</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
              </form>

            </div>

            <!-- Footer note -->
            <div class="mt-6 text-center text-xs text-slate-500 font-mono font-medium drop-shadow-sm">
              AVAAS Confidential Employee Workspace
            </div>

          </div>
        </div>
      `;
    }

    // --- FOOTER ---
    function renderFooter() {
      return `
        <footer class="border-t border-blue-100 bg-white/90 py-6 text-center text-xs text-slate-500">
          <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-blue-900">AVAAS</span>
              <span>• Executive Attendance & Daily Standup Suite</span>
            </div>
            <div class="font-mono text-[11px] text-slate-500">
              Database: SQLite • Authorized: ceo@avaas.me, cpro, cmo, cfo, coo, cto
            </div>
          </div>
        </footer>
      `;
    }

    // Initial load
    fetchUsersFromDb();
    loadAttendanceFromDb();
    render();
  </script>
</body>
</html>
